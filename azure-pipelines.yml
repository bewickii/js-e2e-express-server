trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Build Node.js application'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
        npm run build
      displayName: 'npm install and build'

    - task: CopyFiles@2
      displayName: 'Prepare application files'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: |
          src/**
          public/**
          package.json
          package-lock.json
        TargetFolder: '$(Build.ArtifactStagingDirectory)/app'

    - task: ArchiveFiles@2
      displayName: 'Create ZIP archive'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish application artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/app.zip'
        artifactName: 'nodejs-app'
        publishLocation: 'pipeline'

- stage: Deploy
  displayName: 'Deploy'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy to Azure App Service'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: nodejs-app

          - task: AzureWebApp@1
            displayName: 'Deploy to bewikii-lab'
            inputs:
              azureSubscription: 'sc-bewikii-lab'
              appType: 'webAppLinux'
              appName: 'bewikii-lab'
              package: '$(Pipeline.Workspace)/nodejs-app/app.zip'
              startUpCommand: 'npm start'

